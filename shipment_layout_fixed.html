<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="img/logo_k_out.ico">
    <link rel="stylesheet" href="css/table.css">
    <link rel="stylesheet" href="css/filter.css">
    <title>클라스오토 사내전산 - 차량 출고 및 만기 관리</title>

    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') {
            alert('로그인이 필요한 페이지입니다.');
            location.replace('index.html');
        }
    </script>
    <style>
        #editModalOverlay input[readonly],
        #editModalOverlay textarea[readonly],
        #editModalOverlay select:disabled {
            background-color: #f1f3f5;
            color: #666;
            cursor: default;
            opacity: 1;
        }
        .manager-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:12px 0; }
        .manager-toolbar select { padding:8px; min-width:220px; border:1px solid #d4dbe5; border-radius:5px; }
        .manager-toolbar button { padding:9px 14px; border:0; border-radius:5px; background:#2459a9; color:white; cursor:pointer; }
        .manager-toolbar button:disabled { opacity:.5; cursor:default; }
        #managerMessage { margin:0; font-size:13px; }
        #managerHistorySection { margin-top:20px; padding-top:16px; border-top:1px solid #dce3ee; }
        #managerHistorySection[hidden] { display:none; }
        #managerHistorySection h4 { margin:0 0 10px; }
        .manager-history-scroll { overflow-x:auto; }
        .manager-history-table { width:100%; border-collapse:collapse; font-size:13px; }
        .manager-history-table th, .manager-history-table td { padding:9px; border:1px solid #dce3ee; text-align:left; white-space:nowrap; }
        .manager-history-table th { background:#f1f4f8; }
        .manager-history-table tbody tr:first-child { background:#eef5ff; }
        .manager-change-badge {
            display: inline-block;
            margin-left: 5px;
            padding: 2px 5px;
            border-radius: 4px;
            background: #fff0db;
            color: #b85c00;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }
        .manager-change-badge[hidden] {
            display: none !important;
        }

        .contact-history-section { margin: 20px; padding-top: 16px; border-top: 1px solid #dce3ee; }
        .contact-history-section h4 { margin: 0 0 10px; }
        .contact-history-scroll { overflow-x: auto; max-height: 260px; }
        .contact-history-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .contact-history-table th, .contact-history-table td { padding: 9px; border: 1px solid #dce3ee; text-align: left; vertical-align: top; }
        .contact-history-table th { background: #f1f4f8; white-space: nowrap; position: sticky; top: 0; }
        .contact-history-table .history-content { min-width: 200px; white-space: pre-wrap; overflow-wrap: anywhere; }
        .contact-history-table .history-date { white-space: nowrap; }
        /* 출고 상세 모달: 왼쪽 정보 / 오른쪽 이력 */
        #editModalOverlay { padding: 20px; box-sizing: border-box; }
        #editModalOverlay .modal-window {
            width: min(1440px, calc(100vw - 40px));
            max-width: 1440px;
            max-height: calc(100dvh - 40px);
            display: flex; flex-direction: column; overflow: hidden;
        }
        #editModalOverlay .modal-header,
        #editModalOverlay .modal-footer { flex-shrink: 0; }
        #editModalOverlay #editForm {
            display: flex; flex-direction: column; min-height: 0; overflow: hidden;
        }
        #editModalOverlay .shipment-modal-layout {
            display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
            min-height: 0; overflow: hidden;
        }
        #editModalOverlay .shipment-details-panel {
            padding: 24px; margin: 0; min-width: 0;
            max-height: none; overflow-y: auto;
        }
        #editModalOverlay .modal-grid {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;
        }
        #editModalOverlay .modal-grid .full-row { grid-column: 1 / -1; }
        #editModalOverlay .modal-grid input,
        #editModalOverlay .modal-grid select,
        #editModalOverlay .modal-grid textarea { width: 100%; min-width: 0; box-sizing: border-box; }
        #editModalOverlay .shipment-history-panel {
            min-width: 0; padding: 24px; overflow-y: auto;
            border-left: 1px solid #dce3ee; background: #f7f9fc;
        }
        #editModalOverlay .shipment-history-panel section {
            margin: 0 0 20px !important; padding: 16px;
            border: 1px solid #dce3ee; border-radius: 8px; background: white;
        }
        #editModalOverlay .shipment-history-panel section:last-child { margin-bottom: 0 !important; }
        #editModalOverlay .shipment-history-panel h4 { margin: 0 0 12px; }
        #editModalOverlay .manager-history-scroll,
        #editModalOverlay .contact-history-scroll { max-height: 240px; overflow: auto; }
        @media (max-width: 900px) {
            #editModalOverlay .shipment-modal-layout { display: block; overflow-y: auto; }
            #editModalOverlay .shipment-details-panel,
            #editModalOverlay .shipment-history-panel { overflow: visible; }
            #editModalOverlay .shipment-history-panel { border-left: 0; border-top: 1px solid #dce3ee; }
        }
        @media (max-width: 540px) {
            #editModalOverlay { padding: 8px; }
            #editModalOverlay .modal-window { width: calc(100vw - 16px); max-height: calc(100dvh - 16px); }
            #editModalOverlay .shipment-details-panel,
            #editModalOverlay .shipment-history-panel { padding: 14px; }
            #editModalOverlay .modal-grid { grid-template-columns: minmax(0, 1fr); }
        }
        #editModalOverlay .call-input-body td { background: #f4f8ff; }
        #editModalOverlay #newCallDate, #editModalOverlay #newNextCallDate { width: 135px; padding: 6px; box-sizing: border-box; }
        #editModalOverlay #newCallType { width: 130px; padding: 6px; }
        #editModalOverlay #newCallContent { width: 100%; min-width: 180px; padding: 8px; box-sizing: border-box; resize: vertical; }
        #editModalOverlay #btnSaveCall { padding: 7px 12px; border: 0; border-radius: 4px; background: #2459a9; color: white; cursor: pointer; white-space: nowrap; }
        #editModalOverlay #btnSaveCall:disabled { opacity: .5; cursor: default; }

        /* 통화 입력칸은 한 셀 안에서 여러 줄로 배치 */
        #editModalOverlay .call-history-table { width: 100%; min-width: 0; table-layout: fixed; }
        #editModalOverlay .call-history-table th,
        #editModalOverlay .call-history-table td { white-space: normal; overflow-wrap: anywhere; padding: 8px 5px; }
        #editModalOverlay .call-history-table .history-content { min-width: 0; white-space: pre-wrap; }
        #editModalOverlay .call-history-table th:nth-child(1),
        #editModalOverlay .call-history-table th:nth-child(4) { width: 20%; }
        #editModalOverlay .call-history-table th:nth-child(2) { width: 17%; }
        #editModalOverlay .call-history-table th:nth-child(3) { width: 33%; }
        #editModalOverlay .call-history-table th:nth-child(5) { width: 10%; }
        #editModalOverlay .call-entry-grid {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;
            padding: 10px; min-width: 0; text-align: left;
        }
        #editModalOverlay .call-entry-grid label { display: block; min-width: 0; font-size: 12px; color: #555; }
        #editModalOverlay .call-entry-grid input,
        #editModalOverlay .call-entry-grid select,
        #editModalOverlay .call-entry-grid textarea {
            display: block; width: 100% !important; min-width: 0 !important; max-width: 100%;
            min-inline-size: 0; box-sizing: border-box; margin-top: 5px; padding: 8px;
        }
        #editModalOverlay .call-entry-grid .call-content-field,
        #editModalOverlay .call-entry-grid .call-save-field { grid-column: 1 / -1; }
        #editModalOverlay .call-save-field { text-align: right; }
        @media (max-width: 540px) {
            #editModalOverlay .call-entry-grid { grid-template-columns: minmax(0, 1fr); }
        }

        /* 통화 입력영역: 저장 버튼 포함 2줄 */
        #editModalOverlay .call-entry-grid {
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px 8px;
            padding: 4px;
        }

        #editModalOverlay .call-entry-grid label {
            font-size: 11px;
        }

        #editModalOverlay .call-entry-grid input,
        #editModalOverlay .call-entry-grid select,
        #editModalOverlay .call-entry-grid textarea {
            margin-top: 3px;
            padding: 4px 5px;
            font-size: 12px;
        }

        #editModalOverlay .call-entry-grid input,
        #editModalOverlay .call-entry-grid select {
            height: 30px;
        }

        /* 둘째 줄: 통화내용 */
        #editModalOverlay .call-entry-grid .call-content-field {
            grid-column: 1 / 3;
            grid-row: 2;
        }

        /* 둘째 줄: 저장 버튼 */
        #editModalOverlay .call-entry-grid .call-save-field {
            grid-column: 3;
            grid-row: 2;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
        }

        #editModalOverlay .call-entry-grid #newCallContent {
            height: 42px;
            min-height: 42px;
        }

        #editModalOverlay .call-entry-grid #btnSaveCall {
            height: 32px;
            padding: 5px 12px;
            margin-bottom: 0;
        }

        #editModalOverlay .call-input-body > tr > td {
            padding: 5px;
        }

        #editModalOverlay .shipment-details-panel {
            margin: 16px;
            padding: 16px;
            border: 1px solid #dce3ee;
            border-radius: 8px;
            background: #fff;
        }

        #editModalOverlay #shipmentDetailsTitle {
            margin: 0 0 16px;
            font-size: 16px;
        }

        #editModalOverlay .shipment-details-panel .modal-footer {
            margin-top: 16px;
            padding: 12px 0 0;
            border-top: 1px solid #dce3ee;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* 좌우 섹션 위 여백 통일 */
        #editModalOverlay .shipment-details-panel {
            margin: 16px;
            padding: 14px;
        }

        #editModalOverlay .shipment-history-panel {
            padding: 16px;
        }

        #editModalOverlay #managerHistorySection {
            margin-top: 0 !important;
        }

        /* 왼쪽 출고 정보 입력영역 압축 */
        #editModalOverlay #shipmentDetailsTitle {
            margin: 0 0 10px;
            font-size: 15px;
        }

        #editModalOverlay .shipment-details-panel .modal-grid {
            gap: 8px 12px;
        }

        #editModalOverlay .shipment-details-panel .form-group {
            margin: 0;
            padding: 0;
        }

        #editModalOverlay .shipment-details-panel .form-group label {
            display: block;
            margin: 0 0 3px;
            font-size: 12px;
            line-height: 1.3;
        }

        #editModalOverlay .shipment-details-panel input,
        #editModalOverlay .shipment-details-panel select {
            height: 30px;
            padding: 4px 8px;
            font-size: 13px;
            box-sizing: border-box;
        }

        #editModalOverlay .shipment-details-panel #editNotes {
            height: 48px;
            min-height: 48px;
            padding: 6px 8px;
            box-sizing: border-box;
        }

        #editModalOverlay .shipment-details-panel .modal-footer {
            margin-top: 10px;
            padding: 10px 0 0;
            gap: 8px;
        }

        #editModalOverlay .shipment-details-panel .modal-footer button {
            padding: 7px 14px;
        }

        #editModalOverlay .shipment-details-panel .modal-footer {
            background: transparent;
            border-top: none;
        }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- [분리된 사이드바가 삽입되는 컨테이너] -->
    <div id="sidebarContainer"></div>

    <!-- 우측 메인 영역 -->
    <div class="main-container">
        <header class="navbar">
            <button class="btn-menu-toggle" id="btnToggleSidebar">☰</button>
            <span class="user-info" id="userWelcome">사용자님 환영합니다</span>
            <button class="btn-logout" id="btnLogout">로그아웃</button>
        </header>

        <!-- 차량 출고 목록 화면 -->
        <main class="content" id="viewShipment">
            <div class="page-header">
                <div class="page-title-row">
                    <h2>차량 출고 및 반납일 관리</h2>
                    <div style="display: flex; gap: 8px;">
                        <button type="button" id="btnSendSms" class="btn-reset-all" disabled>
                            선택한 고객에게 문자 보내기 (0)
                        </button>
                        <button type="button" class="btn-reset-all" onclick="resetAllFilters()">전체 조건 초기화</button>
                        <select id="pageSizeSelect" class="page-size-select">
                            <option value="10">10개씩 보기</option>
                            <option value="20" selected>20개씩 보기</option>
                            <option value="50">50개씩 보기</option>
                            <option value="100">100개씩 보기</option>
                        </select>
                    </div>
                </div>

                <div class="filter-container">
                    <select id="dateTypeSelect" class="date-type-select">
                        <option value="release">📅 출고일 기준</option>
                        <option value="return">🏁 반납일 기준</option>
                    </select>

                    <div class="date-filter-group">
                        <input type="date" id="filterStartDate" class="date-input">
                        <span style="color:#888;">~</span>
                        <input type="date" id="filterEndDate" class="date-input">
                    </div>

                    <div class="quick-date-btns">
                        <button type="button" class="btn-quick-date" onclick="setQuickDate('today')">오늘</button>
                        <button type="button" class="btn-quick-date" onclick="setQuickDate('lastMonth')">지난달</button>
                        <button type="button" class="btn-quick-date" onclick="setQuickDate('thisMonth')">이번달</button>
                        <button type="button" class="btn-quick-date" onclick="setQuickDate('nextMonth')">다음달</button>
                        <button type="button" class="btn-quick-date" onclick="setQuickDate('past3Months')">지난3개월</button>
                        <button type="button" class="btn-quick-date" onclick="setQuickDate('next3Months')">향후3개월</button>
                        <button type="button" class="btn-quick-date" onclick="setQuickDate('clear')">기간 비우기</button>
                    </div>

                    <div class="search-box" style="margin-left: auto;">
                        <input type="text" id="tableSearch" placeholder="상호, 고객명, 차종, 금융사, 담당자 검색...">
                    </div>
                </div>
            </div>

            <div class="manager-toolbar">
                <label for="bulkManagerSelect">변경할 담당자</label>
                <select id="bulkManagerSelect" disabled><option value="">사용자 불러오는 중…</option></select>
                <span id="selectedShipmentCount">선택 0건</span>
                <button type="button" id="changeManagerButton" disabled>선택 행 담당자 변경</button>
                <span style="font-size:12px;color:#777">페이지 이동·검색 후에도 선택이 유지됩니다.</span>
            </div>
            <p id="managerMessage" role="status" aria-live="polite"></p>
            <div class="table-wrapper">
                <div class="table-scroll">
                    <table class="excel-table">
                        <thead>
                            <tr id="tableHeaderRow">
                                <th class="col-checkbox">
                                    <input type="checkbox" id="checkAll" title="전체 선택">
                                </th>
                                <th>순번</th>
                                <th data-key="capital" class="yellow">금융사 <span class="sort-icon">↕</span></th>
                                <th data-key="type">렌트/리스 <span class="sort-icon">↕</span></th>
                                <th data-key="company" class="yellow">상호(고객명) <span class="sort-icon">↕</span></th>
                                <th data-key="ceo">대표자/담당자 <span class="sort-icon">↕</span></th>
                                <th data-key="phone">연락처 <span class="sort-icon">↕</span></th>
                                <th data-key="maker">메이커 <span class="sort-icon">↕</span></th>
                                <th data-key="model" class="yellow">차종<span class="sort-icon">↕</span></th>
                                <th data-key="modifier">차종(MODIFY) <span class="sort-icon">↕</span></th>
                                <th data-key="price">차량가격 <span class="sort-icon">↕</span></th>
                                <th data-key="period">운용기간 <span class="sort-icon">↕</span></th>
                                <th data-key="releaseDate">출고일<span class="sort-icon">↕</span></th>
                                <th data-key="returnDate">반납일<span class="sort-icon">↕</span></th>
                                <!-- <th data-key="ag">AG <span class="sort-icon">↕</span></th>
                                <th data-key="agFee">AG수수료(부가세별도) <span class="sort-icon">↕</span></th> -->
                                <th data-key="manager" class="yellow">담당자<span class="sort-icon">↕</span></th>
                            </tr>
                        </thead>
                        <tbody id="shipmentTableBody"></tbody>
                    </table>
                </div>

                <div class="pagination-container">
                    <div id="pageInfoText">총 0건 중 0 - 0건 표시</div>
                    <div class="pagination-buttons" id="paginationControls"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- 상세 편집 모달 팝업 -->
    <div class="modal-overlay" id="editModalOverlay">
        <div class="modal-window">
            <div class="modal-header">
                <h3>출고 및 계약 관리</h3>
                <button type="button" class="modal-close-btn" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="editForm" onsubmit="handleModalSubmit(event)">
                <div class="shipment-modal-layout">
                    <section class="modal-body shipment-details-panel" aria-labelledby="shipmentDetailsTitle">
                        <h4 id="shipmentDetailsTitle">출고 정보</h4>

                        <input type="hidden" id="editRowId">
                        <div class="modal-grid">
                            <div class="form-group">
                                <label>상호(고객명) *</label>
                                <input type="text" id="editCompany" required>
                            </div>
                            <div class="form-group">
                                <label>대표자 / 담당자</label>
                                <input type="text" id="editCeo">
                            </div>
                            <div class="form-group">
                                <label>연락처</label>
                                <input type="text" id="editPhone">
                            </div>
                            <div class="form-group">
                                <label>금융사</label>
                                <input type="text" id="editCapital">
                            </div>
                            <div class="form-group">
                                <label>계약 유형</label>
                                <select id="editType">
                                    <option value="렌트">렌트</option>
                                    <option value="리스">리스</option>
                                    <option value="할부">할부</option>
                                    <option value="기타">기타</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>메이커(제조사)</label>
                                <input type="text" id="editMaker">
                            </div>
                            <div class="form-group">
                                <label>차종(기본 모델명)</label>
                                <input type="text" id="editModel">
                            </div>
                            <div class="form-group">
                                <label>세부 차종 (MODIFY)</label>
                                <input type="text" id="editModifier">
                            </div>
                            <div class="form-group">
                                <label>차량가격 (원)</label>
                                <input type="text" id="editPrice" readonly>
                            </div>
                            <div class="form-group">
                                <label>운용기간 (개월)</label>
                                <input type="number" id="editPeriod">
                            </div>
                            <div class="form-group">
                                <label>출고일</label>
                                <input type="date" id="editReleaseDate">
                            </div>
                            <div class="form-group">
                                <label>반납일 (만기일)</label>
                                <input type="date" id="editReturnDate">
                            </div>
                            <div class="form-group">
                                <label>AG 요율 (%)</label>
                                <input type="number" step="0.01" id="editAg">
                            </div>
                            <div class="form-group">
                                <label>AG 수수료 (원)</label>
                                <input type="text" id="editAgFee" readonly>
                            </div>
                            <div class="form-group">
                                <label>담당자</label>
                                <input type="text" id="editmanager">
                            </div>
                            <div class="form-group">
                                <label>차량 번호</label>
                                <input type="text" id="editCarNo" placeholder="">
                            </div>
                            <div class="form-group full-row">
                                <label>관리 비고 및 메모</label>
                                <textarea id="editNotes" rows="3" placeholder="특이사항, 연장 여부 등"></textarea>
                            </div>
                        </div>                        
                        <div class="modal-footer">
                            <button type="button" class="btn-modal-cancel" onclick="closeEditModal()">취소</button>
                            <button type="submit" class="btn-modal-save">저장 완료</button>
                        </div>
                </section>                

                <aside class="shipment-history-panel" aria-label="고객 이력">
                <section id="managerHistorySection" hidden aria-labelledby="managerHistoryTitle" style="margin:0 20px 20px">
                    <h4 id="managerHistoryTitle">담당자 변경 이력</h4>
                    <p id="managerHistoryStatus" role="status" aria-live="polite"></p>
                    <div class="manager-history-scroll" id="managerHistoryTableWrap" hidden>
                        <table class="manager-history-table">
                            <thead><tr><th>배정 일시</th><th>담당자</th><th>변경한 사용자</th></tr></thead>
                            <tbody id="managerHistoryBody"></tbody>
                        </table>
                    </div>
                </section>
                <section class="contact-history-section" aria-labelledby="callHistoryTitle">
                    <h4 id="callHistoryTitle">통화이력</h4>
                    <p id="callHistoryStatus" role="status" aria-live="polite"></p>
                    <div class="contact-history-scroll">
                        <table class="contact-history-table call-history-table">
                            <thead><tr><th>콜날짜</th><th>구분</th><th>통화내용</th><th>다음콜 예정일</th><th>저장</th></tr></thead>
                            <tbody class="call-input-body">
                                <tr><td colspan="5">
                                    <div class="call-entry-grid">
                                        <label>콜날짜<input type="date" id="newCallDate" aria-label="콜날짜"></label>
                                        <label>구분<select id="newCallType" aria-label="통화구분">
                                            <option value="통화성공">통화성공</option><option value="부재">부재</option>
                                            <option value="전원꺼짐">전원꺼짐</option><option value="유효하지않는번호">유효하지않는번호</option>
                                            <option value="기타">기타</option>
                                        </select></label>
                                        <label>다음콜 예정일<input type="date" id="newNextCallDate" aria-label="다음콜 예정일"></label>
                                        <label class="call-content-field">통화내용<textarea id="newCallContent" rows="" placeholder="통화내용을 입력하세요" aria-label="통화내용"></textarea></label>
                                        <div class="call-save-field"><button type="button" id="btnSaveCall" onclick="saveCallHistory()">저장</button></div>
                                    </div>
                                </td></tr>
                            </tbody>
                            <tbody id="callHistoryBody"></tbody>
                        </table>
                    </div>
                </section>
                <section class="contact-history-section" aria-labelledby="smsHistoryTitle">
                    <h4 id="smsHistoryTitle">문자메시지이력</h4>
                    <p id="smsHistoryStatus" role="status" aria-live="polite"></p>
                    <div class="contact-history-scroll">
                        <table class="contact-history-table">
                            <thead><tr><th>문자발송날짜</th><th>문자메시지내용</th><th>발송성공여부</th></tr></thead>
                            <tbody id="smsHistoryBody"></tbody>
                        </table>
                    </div>
                </section>
                </aside>
                </div>                
            </form>
        </div>
    </div>

    <!-- 사이드바 로더 스크립트 연결 -->
    <script src="sidebar.js"></script>
    <script src="js/user_activity.js"></script>

    <script>
        let currentUserId = '';
        let currentUserGrade = '';
        let identityLoaded = false;
        let shipmentData = [];
        let filteredData = [];
        let currentPage = 1;
        let pageSize = 20;
        let selectedRowIds = new Set();
        let currentSort = { key: 'releaseDate', asc: false };

        let managerUsers = [];
        let changingManager = false;
        const managerSelect = document.getElementById('bulkManagerSelect');
        const managerButton = document.getElementById('changeManagerButton');
        const managerMessage = document.getElementById('managerMessage');

        function updateManagerControls() {
            document.getElementById('selectedShipmentCount').textContent = `선택 ${selectedRowIds.size}건`;
            managerButton.disabled = changingManager || !selectedRowIds.size || !managerSelect.value;
            managerSelect.disabled = changingManager || !managerUsers.length;
            updateSmsButton();
        }

        async function loadManagerUsers() {
            try {
                const response = await fetch('api/get_inner_users.php', { credentials:'same-origin', cache:'no-store' });
                const result = await response.json();
                if (!response.ok || result.success !== true || !Array.isArray(result.users)) throw new Error(result.message || '사용자 목록을 불러오지 못했습니다.');
                managerUsers = result.users.filter(user => user.user_id != null && String(user.user_id) !== '');
                managerSelect.replaceChildren(new Option('담당자를 선택하세요', ''));
                managerUsers.sort((a,b) => String(a.name || '').localeCompare(String(b.name || ''), 'ko')).forEach(user => {
                    managerSelect.add(new Option(`${user.name || user.user_id} (${user.user_id})${user.department ? ' · ' + user.department : ''}`, String(user.user_id)));
                });
            } catch (error) {
                managerSelect.replaceChildren(new Option('사용자 조회 실패', ''));
                managerMessage.textContent = error.message;
            }
            updateManagerControls();
        }
        managerSelect.addEventListener('change', updateManagerControls);
        managerButton.addEventListener('click', async () => {
            const user = managerUsers.find(user => String(user.user_id) === managerSelect.value);
            const ids = [...selectedRowIds];
            if (changingManager || !user || !ids.length) return;
            if (!confirm(`선택한 ${ids.length}건의 담당자를 ${user.name || user.user_id} (${user.user_id})님으로 변경하시겠습니까?`)) return;
            changingManager = true;
            updateManagerControls();
            managerMessage.textContent = '담당자를 변경하는 중입니다…';
            try {
                const response = await fetch('api/update_shipment_manager.php', {
                    method:'POST', credentials:'same-origin',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({ ids, manager_id:String(user.user_id) })
                });
                const result = await response.json();
                if (!response.ok || result.success !== true) throw new Error(result.message || '담당자 변경에 실패했습니다.');
                shipmentData.forEach(item => {
                    if (ids.includes(item.id)) {
                        item.manager_id = result.manager_id;
                        item.manager = result.manager;
                    }
                });
                ids.forEach(id => selectedRowIds.delete(id));
                closeEditModal();
                markManagerChanges.cache?.clear(); // 추가
                applyFilters();
                managerMessage.textContent = `${result.updated_count}건의 담당자가 ${result.manager}님으로 변경되었습니다.`;
            } catch (error) {
                managerMessage.textContent = error.message + ' 변경 결과가 불확실하면 새로고침 후 확인해주세요.';
            } finally {
                changingManager = false;
                updateManagerControls();
            }
        });
        loadManagerUsers();

        // 1. 공통 사이드바 불러오기 및 출고 데이터 로드
        initCommonSidebar('navShipment');
        loadShipmentData();

        // 2. DB 데이터 로드
        async function loadShipmentData() {
            const tbody = document.getElementById('shipmentTableBody');
            tbody.innerHTML = `<tr><td colspan="17" style="padding: 30px; color: #555;">데이터를 불러오는 중입니다...</td></tr>`;

            try {
                identityLoaded = false;
                const identityResponse = await fetch('api/login.php', { credentials: 'same-origin', cache: 'no-store' });
                const identity = await identityResponse.json();
                if (!identityResponse.ok || identity.success !== true || !identity.user_id || !identity.grade) {
                    throw new Error(identity.message || '로그인 사용자 정보를 확인할 수 없습니다.');
                }
                currentUserId = String(identity.user_id);
                currentUserGrade = String(identity.grade).trim();
                identityLoaded = true;
                const response = await fetch('api/get_shipments.php', { credentials: 'same-origin', cache: 'no-store' });
                if (!response.ok) throw new Error('서버 응답 오류');

                const result = await response.json();
                if (result.status === 'success') {
                    shipmentData = result.data.map((item, idx) => ({
                        id: item.id || `row_${idx}`,
                        carNo: item.carNo || '',
                        notes: item.notes || '',
                        ...item,
                        id: String(item.id || `row_${idx}`)
                    }));
                    if (currentUserGrade === '일반') {
                        shipmentData = shipmentData.filter(item => String(item.manager_id ?? '') === currentUserId);
                    }
                    const existingIds = new Set(shipmentData.map(item => item.id));
                    selectedRowIds.forEach(id => { if (!existingIds.has(id)) selectedRowIds.delete(id); });
                    applyFilters();
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                shipmentData = [];
                selectedRowIds.clear();
                applyFilters();
                document.getElementById('managerMessage').textContent = error.message;
                console.error('출고 목록 수신 에러:', error);
                tbody.innerHTML = `<tr><td colspan="17" style="padding: 24px; color: #e74c3c;">데이터를 가져오지 못했습니다. DB 연결 및 get_shipments.php를 확인하세요.</td></tr>`;
            }
        }

        // 3. 필터링 로직
        function applyFilters() {
            const keyword = document.getElementById('tableSearch').value.toLowerCase().trim();
            const dateType = document.getElementById('dateTypeSelect').value;
            const startDate = document.getElementById('filterStartDate').value;
            const endDate = document.getElementById('filterEndDate').value;

            filteredData = shipmentData.filter(item => {
                if (!identityLoaded) return false;
                if (currentUserGrade === '일반' && String(item.manager_id ?? '') !== currentUserId) return false;
                const matchesKeyword = !keyword || (
                    String(item.company || '').toLowerCase().includes(keyword) ||
                    String(item.ceo || '').toLowerCase().includes(keyword) ||
                    String(item.model || '').toLowerCase().includes(keyword) ||
                    String(item.capital || '').toLowerCase().includes(keyword) ||
                    String(item.manager || '').toLowerCase().includes(keyword) ||
                    String(item.carNo || '').toLowerCase().includes(keyword) ||
                    String(item.phone || '').includes(keyword)
                );

                let matchesDate = true;
                const targetDate = (dateType === 'release') ? item.releaseDate : item.returnDate;

                if (startDate && targetDate < startDate) matchesDate = false;
                if (endDate && targetDate > endDate) matchesDate = false;

                return matchesKeyword && matchesDate;
            });

            currentPage = 1;
            updateTable();
        }

        window.setQuickDate = function(periodType) {
            const startInput = document.getElementById('filterStartDate');
            const endInput = document.getElementById('filterEndDate');
            const now = new Date();

            const formatDate = (d) => {
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            if (periodType === 'today') {
                const todayStr = formatDate(now);
                startInput.value = todayStr;
                endInput.value = todayStr;
            } else if (periodType === 'lastMonth') {
                const firstDay = new Date(now.getFullYear(), now.getMonth()-1, 1);
                const lastDay = new Date(now.getFullYear(), now.getMonth(), 0);
                startInput.value = formatDate(firstDay);
                endInput.value = formatDate(lastDay);
            } else if (periodType === 'thisMonth') {
                const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
                const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
                startInput.value = formatDate(firstDay);
                endInput.value = formatDate(lastDay);
            } else if (periodType === 'nextMonth') {
                const firstDay = new Date(now.getFullYear(), now.getMonth() + 1, 1);
                const lastDay = new Date(now.getFullYear(), now.getMonth() + 2, 0);
                startInput.value = formatDate(firstDay);
                endInput.value = formatDate(lastDay);
            } else if (periodType === 'past3Months') {
                const firstDay = new Date(now.getFullYear(), now.getMonth() - 3, 0);
                const lastDay = now;
                startInput.value = formatDate(firstDay);
                endInput.value = formatDate(lastDay);
            } else if (periodType === 'next3Months') {
                const firstDay = now;
                const lastDay = new Date(now.getFullYear(), now.getMonth() + 3, 0);
                startInput.value = formatDate(firstDay);
                endInput.value = formatDate(lastDay);
            } else if (periodType === 'clear') {
                startInput.value = '';
                endInput.value = '';
            }

            applyFilters();
        };

        window.resetAllFilters = function() {
            document.getElementById('dateTypeSelect').value = 'release';
            document.getElementById('filterStartDate').value = '';
            document.getElementById('filterEndDate').value = '';
            document.getElementById('tableSearch').value = '';
            applyFilters();
        };

        // 4. 테이블 출력
        function updateTable() {
            const total = filteredData.length;
            const totalPages = Math.ceil(total / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const startIdx = (currentPage - 1) * pageSize;
            const endIdx = Math.min(startIdx + pageSize, total);
            const pageSlice = filteredData.slice(startIdx, endIdx);

            const tbody = document.getElementById('shipmentTableBody');
            const checkAll = document.getElementById('checkAll');

            if (total === 0) {
                tbody.innerHTML = `<tr><td colspan="17" style="padding: 24px; color:#888;">조회 조건과 일치하는 데이터가 없습니다.</td></tr>`;
                if (checkAll) { checkAll.checked = false; checkAll.indeterminate = false; checkAll.disabled = true; }
            } else {
                if (checkAll) checkAll.disabled = false;

                tbody.innerHTML = pageSlice.map((item, index) => {
                    const displayNo = total - (startIdx + index);
                    const isChecked = selectedRowIds.has(item.id);

                    return `
                        <tr class="${isChecked ? 'row-selected' : ''}" data-id="${item.id}">
                            <td class="col-checkbox" onclick="event.stopPropagation()">
                                <input type="checkbox" class="row-checkbox" data-id="${item.id}" ${isChecked ? 'checked' : ''} onchange="toggleSelectRow('${item.id}', this.checked)">
                            </td>
                            <td style="font-weight: 600; color: #555;">${displayNo}</td>
                            <td>${item.capital || ''}</td>
                            <td>${item.type || ''}</td>
                            <td class="text-left">
                                <span class="link-company" onclick="openEditModal('${item.id}')" title="클릭하여 상세 정보 수정">${item.company || '(상호 없음)'}</span>
                            </td>
                            <td>${item.ceo || ''}</td>
                            <td>${item.phone || ''}</td>
                            <td>${item.maker || ''}</td>
                            <td>${item.model || ''}</td>
                            <td class="text-left">${item.modifier || ''}</td>
                            <td class="text-right">${Number(item.price || 0).toLocaleString()}</td>
                            <td>${item.period || ''}</td>
                            <td>${item.releaseDate || ''}</td>
                            <td style="font-weight: 600; color: #d32f2f;">${item.returnDate || ''}</td>                            
                            <td class="manager-cell">
                                ${item.manager || ''}
                                <span class="manager-change-badge" hidden
                                    title="담당자 변경 이력이 있습니다. 상호를 클릭하면 확인할 수 있습니다.">
                                    변경
                                </span>
                            </td>
                        </tr>
                    `;
                }).join('');

                syncCheckAllState(pageSlice);
            }
            // <td>${item.ag || ''}</td>
            // <td class="text-right">${Number(item.agFee || 0).toLocaleString()}</td>

            document.getElementById('pageInfoText').textContent = 
                total === 0 ? "데이터 없음" : `총 ${total.toLocaleString()}건 중 ${startIdx + 1} - ${endIdx}건 표시`;

            renderPaginationButtons(totalPages);
            updateManagerControls();
            markManagerChanges();
        }

        async function markManagerChanges() {
            // 이미 조회한 이력은 페이지 이동 시 재사용합니다.
            const cache = markManagerChanges.cache ??= new Map();
            const rows = Array.from(
                document.querySelectorAll('#shipmentTableBody tr[data-id]')
            );

            async function worker() {
                while (rows.length) {
                    const row = rows.shift();
                    const id = row.dataset.id;
                    const badge = row.querySelector('.manager-change-badge');
                    if (!badge) continue;

                    try {
                        let request = cache.get(id);

                        if (!request) {
                            request = (async () => {
                                const response = await fetch(
                                    `api/get_shipment_manager_history.php?shipment_id=${encodeURIComponent(id)}`,
                                    {
                                        credentials: 'same-origin',
                                        cache: 'no-store'
                                    }
                                );

                                const result = await response.json();

                                if (!response.ok || result.success !== true ||
                                    !Array.isArray(result.history)) {
                                    throw new Error('담당자 이력 조회 실패');
                                }

                                const managers = result.history.map(entry => {
                                const id = String(entry.manager_user_id ?? '').trim();
                                const name = String(entry.manager_name ?? '').trim();

                                return id ? `id:${id}` : name ? `name:${name}` : 'unassigned';
                            });

                            return new Set(managers).size >= 2;
                            })();

                            cache.set(id, request);
                        }

                        const changed = await request;
                        if (row.isConnected) badge.hidden = !changed;
                    } catch (error) {
                        cache.delete(id);
                        if (row.isConnected) {
                            badge.hidden = false;
                            badge.textContent = '확인 실패';
                            badge.title = '담당자 변경 이력을 조회하지 못했습니다.';
                        }
                    }
                }
            }

            // 요청이 한꺼번에 몰리지 않도록 최대 4개씩 조회합니다.
            await Promise.all(Array.from({ length: 4 }, () => worker()));
        }

        // 체크박스 제어
        document.getElementById('checkAll').addEventListener('change', function() {
            const isChecked = this.checked;
            const startIdx = (currentPage - 1) * pageSize;
            const endIdx = Math.min(startIdx + pageSize, filteredData.length);
            const currentPageRows = filteredData.slice(startIdx, endIdx);

            currentPageRows.forEach(item => {
                if (isChecked) selectedRowIds.add(item.id);
                else selectedRowIds.delete(item.id);
            });

            document.querySelectorAll('.row-checkbox').forEach(cb => {
                cb.checked = isChecked;
                const tr = cb.closest('tr');
                if (tr) tr.classList.toggle('row-selected', isChecked);
            });
            syncCheckAllState(currentPageRows);
        });

        window.toggleSelectRow = function(id, isChecked) {
            if (isChecked) selectedRowIds.add(id);
            else selectedRowIds.delete(id);

            const tr = document.querySelector(`tr[data-id="${id}"]`);
            if (tr) tr.classList.toggle('row-selected', isChecked);

            const startIdx = (currentPage - 1) * pageSize;
            const endIdx = Math.min(startIdx + pageSize, filteredData.length);
            const currentPageRows = filteredData.slice(startIdx, endIdx);
            syncCheckAllState(currentPageRows);
        };

        function syncCheckAllState(currentPageRows) {
            const checkAll = document.getElementById('checkAll');
            updateManagerControls();
            if (!checkAll || currentPageRows.length === 0) return;
            const allSelected = currentPageRows.every(item => selectedRowIds.has(item.id));
            const someSelected = currentPageRows.some(item => selectedRowIds.has(item.id));
            checkAll.checked = allSelected;
            checkAll.indeterminate = !allSelected && someSelected;
        }

        let managerHistoryController = null;
        let managerHistoryRequest = 0;

        async function loadManagerHistory(shipmentId) {
            if (managerHistoryController) managerHistoryController.abort();
            const controller = new AbortController();
            managerHistoryController = controller;
            const request = ++managerHistoryRequest;
            const section = document.getElementById('managerHistorySection');
            const status = document.getElementById('managerHistoryStatus');
            const body = document.getElementById('managerHistoryBody');
            const wrap = document.getElementById('managerHistoryTableWrap');
            section.hidden = false;
            wrap.hidden = true;
            body.replaceChildren();
            status.textContent = '담당자 이력을 불러오는 중입니다…';
            try {
                const response = await fetch(`api/get_shipment_manager_history.php?shipment_id=${encodeURIComponent(shipmentId)}`, {
                    credentials:'same-origin', cache:'no-store', signal:controller.signal
                });
                const result = await response.json();
                if (request !== managerHistoryRequest) return;
                if (!response.ok || result.success !== true || !Array.isArray(result.history)) throw new Error(result.message || '담당자 이력을 불러오지 못했습니다.');
                if (result.history.length < 2) { section.hidden = true; return; }
                result.history.forEach((entry,index) => {
                    const row = document.createElement('tr');
                    const manager = entry.manager_name || entry.manager_user_id || '미지정';
                    const changedBy = entry.changed_by_name || entry.changed_by || '—';
                    [entry.assigned_at || '—', manager + (index === 0 ? ' (최신)' : ''), changedBy].forEach(value => {
                        const cell = document.createElement('td');
                        cell.textContent = value;
                        row.appendChild(cell);
                    });
                    body.appendChild(row);
                });
                status.textContent = `총 ${result.history.length}건 · 최신순`;
                wrap.hidden = false;
            } catch (error) {
                if (error.name === 'AbortError' || request !== managerHistoryRequest) return;
                status.textContent = error.message;
            }
        }

        let contactHistoryController = null;
        let contactHistoryRequest = 0;

        async function loadContactHistory(shipmentId) {
            if (contactHistoryController) contactHistoryController.abort();
            contactHistoryController = new AbortController();
            const request = ++contactHistoryRequest;
            const signal = contactHistoryController.signal;
            const definitions = [
                ['call', 'call_date', 'call_type', 'call_content', 'next_call_date'],
                ['sms', 'sms_date', 'sms_content', 'sms_status']
            ];
            await Promise.all(definitions.map(async ([type, ...fields]) => {
                const body = document.getElementById(type + 'HistoryBody');
                const status = document.getElementById(type + 'HistoryStatus');
                body.replaceChildren();
                status.textContent = '이력을 불러오는 중입니다…';
                try {
                    const response = await fetch(
                        `api/get_shipment_contact_history.php?shipment_id=${encodeURIComponent(shipmentId)}&type=${type}`,
                        { credentials: 'same-origin', cache: 'no-store', signal }
                    );
                    const result = await response.json();
                    if (request !== contactHistoryRequest) return;
                    if (!response.ok || result.success !== true || !Array.isArray(result.history)) {
                        throw new Error(result.message || '이력 조회에 실패했습니다.');
                    }
                    result.history.forEach(entry => {
                        const row = document.createElement('tr');
                        fields.forEach(field => {
                            const cell = document.createElement('td');
                            const value = entry[field];
                            cell.textContent = value ? (type === 'call' && field.endsWith('_date') ? String(value).slice(0, 10) : value) : (field === 'sms_status' ? '미확인' : '—');
                            cell.className = field.endsWith('_content') ? 'history-content' : field.endsWith('_date') ? 'history-date' : '';
                            row.appendChild(cell);
                        });
                        if (type === 'call') row.appendChild(document.createElement('td'));
                        body.appendChild(row);
                    });
                    status.textContent = result.history.length ? `총 ${result.history.length}건 · 최신순` : '';
                    if (!result.history.length) {
                        const row = document.createElement('tr');
                        const cell = document.createElement('td');
                        cell.colSpan = fields.length + (type === 'call' ? 1 : 0);
                        cell.textContent = '등록된 이력이 없습니다.';
                        cell.style.cssText = 'text-align:center;padding:20px;color:#888';
                        row.appendChild(cell);
                        body.appendChild(row);
                    }
                } catch (error) {
                    if (error.name === 'AbortError' || request !== contactHistoryRequest) return;
                    status.textContent = error.message;
                }
            }));
        }

        async function saveCallHistory() {
            const button = document.getElementById('btnSaveCall');
            if (button.disabled) return;
            const shipmentId = document.getElementById('editRowId').value;
            const callDate = document.getElementById('newCallDate').value;
            if (!shipmentId || !callDate) {
                alert('출고 정보와 콜날짜를 확인해주세요.');
                return;
            }
            button.disabled = true;
            button.textContent = '저장 중…';
            try {
                const response = await fetch('api/insert_call.php', {
                    method: 'POST', credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        category_id: shipmentId,
                        call_date: callDate,
                        call_type: document.getElementById('newCallType').value,
                        call_content: document.getElementById('newCallContent').value.trim(),
                        next_call_date: document.getElementById('newNextCallDate').value
                    })
                });
                const raw = await response.text();
                let result;
                try { result = JSON.parse(raw); }
                catch (_) { throw new Error('저장 서버가 JSON을 반환하지 않았습니다. api/insert_call.php 경로와 PHP 오류를 확인해주세요.'); }
                if (!response.ok || result.success !== true) throw new Error(result.message || '저장에 실패했습니다.');
                if (document.getElementById('editRowId').value === shipmentId) {
                    document.getElementById('newCallContent').value = '';
                    document.getElementById('newNextCallDate').value = '';
                    await loadContactHistory(shipmentId);
                }
            } catch (error) {
                alert(error.message);
            } finally {
                button.disabled = false;
                button.textContent = '저장';
            }
        }

        // 5. 모달 처리
        const editModalOverlay = document.getElementById('editModalOverlay');

        window.openEditModal = function(id) {
            const item = shipmentData.find(d => String(d.id) === String(id));
            if (!item) return;

            document.getElementById('editRowId').value = item.id;
            document.getElementById('editCompany').value = item.company || '';
            document.getElementById('editCeo').value = item.ceo || '';
            document.getElementById('editPhone').value = item.phone || '';
            document.getElementById('editCapital').value = item.capital || '';
            document.getElementById('editType').value = item.type || '렌트';
            document.getElementById('editMaker').value = item.maker || '';
            document.getElementById('editModel').value = item.model || '';
            document.getElementById('editModifier').value = item.modifier || '';
            // document.getElementById('editPrice').value = item.price || 0;
            document.getElementById('editPrice').value = Number(String(item.price || 0).replace(/,/g, '')).toLocaleString('ko-KR');
            document.getElementById('editPeriod').value = item.period || 0;
            document.getElementById('editReleaseDate').value = item.releaseDate || '';
            document.getElementById('editReturnDate').value = item.returnDate || '';
            document.getElementById('editAg').value = item.ag || 0;
            // document.getElementById('editAgFee').value = item.agFee || 0;
            document.getElementById('editAgFee').value = Number(String(item.agFee || 0).replace(/,/g, '')).toLocaleString('ko-KR');
            document.getElementById('editmanager').value = item.manager || '';
            document.getElementById('editCarNo').value = item.carNo || '';
            document.getElementById('editNotes').value = item.notes || '';

            editModalOverlay.classList.add('active');
            loadManagerHistory(item.id);
            const today = new Date();
            document.getElementById('newCallDate').value = [today.getFullYear(), String(today.getMonth() + 1).padStart(2, '0'), String(today.getDate()).padStart(2, '0')].join('-');
            document.getElementById('newCallType').value = '통화성공';
            document.getElementById('newCallContent').value = '';
            document.getElementById('newNextCallDate').value = '';
            loadContactHistory(item.id);
        };

        window.closeEditModal = function() {
            contactHistoryRequest++;
            if (contactHistoryController) contactHistoryController.abort();
            managerHistoryRequest++;
            if (managerHistoryController) managerHistoryController.abort();
            editModalOverlay.classList.remove('active');
        };

        window.handleModalSubmit = async function(event) {
            event.preventDefault();
            const id = document.getElementById('editRowId').value;
            const targetItem = shipmentData.find(d => String(d.id) === String(id));
            if (!targetItem) return;

            targetItem.company = document.getElementById('editCompany').value.trim();
            targetItem.ceo = document.getElementById('editCeo').value.trim();
            targetItem.phone = document.getElementById('editPhone').value.trim();
            targetItem.capital = document.getElementById('editCapital').value.trim();
            targetItem.type = document.getElementById('editType').value;
            targetItem.maker = document.getElementById('editMaker').value.trim();
            targetItem.model = document.getElementById('editModel').value.trim();
            targetItem.modifier = document.getElementById('editModifier').value.trim();
            // targetItem.price = parseInt(document.getElementById('editPrice').value, 10) || 0;
            targetItem.price = parseInt(document.getElementById('editPrice').value.replace(/,/g, ''),10) || 0;
            targetItem.period = parseInt(document.getElementById('editPeriod').value, 10) || 0;
            targetItem.releaseDate = document.getElementById('editReleaseDate').value;
            targetItem.returnDate = document.getElementById('editReturnDate').value;
            targetItem.ag = parseFloat(document.getElementById('editAg').value) || 0;
            // targetItem.agFee = parseInt(document.getElementById('editAgFee').value, 10) || 0;
            targetItem.agFee = parseInt(document.getElementById('editAgFee').value.replace(/,/g, ''),10) || 0;
            targetItem.manager = document.getElementById('editmanager').value.trim();
            targetItem.carNo = document.getElementById('editCarNo').value.trim();
            targetItem.notes = document.getElementById('editNotes').value.trim();

            try {
                await fetch('api/update_shipment.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(targetItem)
                });
            } catch (e) {
                console.warn('DB 업데이트 연동 건너뜀:', e);
            }

            closeEditModal();
            applyFilters();
            alert('출고 정보가 수정되었습니다.');
        };

        // 6. 페이지네이션 & 정렬
        function renderPaginationButtons(totalPages) {
            const container = document.getElementById('paginationControls');
            let html = '';

            html += `<button class="btn-page" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(1)">«</button>`;
            html += `<button class="btn-page" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">‹</button>`;

            let start = Math.max(1, currentPage - 2);
            let end = Math.min(totalPages, start + 4);
            if (end - start < 4) start = Math.max(1, end - 4);

            for (let i = start; i <= end; i++) {
                html += `<button class="btn-page ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }

            html += `<button class="btn-page" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">›</button>`;
            html += `<button class="btn-page" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${totalPages})">»</button>`;

            container.innerHTML = html;
        }

        window.goToPage = function(page) {
            currentPage = page;
            updateTable();
        };

        document.getElementById('pageSizeSelect').addEventListener('change', (e) => {
            pageSize = parseInt(e.target.value, 10);
            currentPage = 1;
            updateTable();
        });

        document.getElementById('dateTypeSelect').addEventListener('change', applyFilters);
        document.getElementById('filterStartDate').addEventListener('change', applyFilters);
        document.getElementById('filterEndDate').addEventListener('change', applyFilters);
        document.getElementById('tableSearch').addEventListener('input', applyFilters);

        document.querySelectorAll('#tableHeaderRow th[data-key]').forEach(th => {
            th.addEventListener('click', () => {
                const key = th.dataset.key;
                if (!key) return;

                if (currentSort.key === key) {
                    currentSort.asc = !currentSort.asc;
                } else {
                    currentSort.key = key;
                    currentSort.asc = true;
                }

                filteredData.sort((a, b) => {
                    let valA = a[key];
                    let valB = b[key];
                    if (typeof valA === 'number' && typeof valB === 'number') {
                        return currentSort.asc ? valA - valB : valB - valA;
                    }
                    valA = String(valA || '');
                    valB = String(valB || '');
                    return currentSort.asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                });

                document.querySelectorAll('#tableHeaderRow th .sort-icon').forEach(icon => icon.textContent = '↕');
                th.querySelector('.sort-icon').textContent = currentSort.asc ? '▲' : '▼';

                updateTable();
            });
        });

        // 사용자명 및 로그아웃
        const userName = sessionStorage.getItem('userName') || '관리자';
        document.getElementById('userWelcome').textContent = `${userName}님 환영합니다`;

        document.getElementById('btnLogout').addEventListener('click', () => {
            if (confirm('로그아웃 하시겠습니까?')) {
                sessionStorage.removeItem('isLoggedIn');
                sessionStorage.removeItem('userName');
                location.replace('index.html');
            }
        });

        document.querySelectorAll(
            '#editModalOverlay input, #editModalOverlay select, #editModalOverlay textarea'
        ).forEach(element => {
            if (element.type === 'hidden') return;

            element.disabled = false;

            if (element.tagName !== 'SELECT') {
                element.readOnly = element.id === 'editmanager';
            } 
        });

        function updateSmsButton() {
            const button = document.getElementById('btnSendSms');

            button.textContent =
                `선택한 고객에게 문자 보내기 (${selectedRowIds.size})`;

            button.disabled = selectedRowIds.size === 0;
        }

        document.getElementById('btnSendSms').addEventListener('click', () => {
            const selected = shipmentData.filter(item =>
                selectedRowIds.has(item.id)
            );

            // 휴대폰번호 정리: +82 번호도 국내 형식으로 통일
            const numbers = [...new Set(
                selected.map(item => {
                    let number = String(item.phone || '')
                        .replace(/[^\d+]/g, '');

                    if (number.startsWith('+82')) {
                        number = '0' + number.slice(3);
                    }

                    return number;
                }).filter(number =>
                    /^01[016789]\d{7,8}$/.test(number)
                )
            )];

            const skipped = selected.length - numbers.length;

            if (!numbers.length) {
                alert('선택한 고객에게 유효한 휴대폰번호가 없습니다.');
                return;
            }

            const message =
                `${numbers.length}개 번호로 문자 작성 화면을 여시겠습니까?` +
                (skipped
                    ? `\n번호가 없거나 중복된 ${skipped}건은 제외됩니다.`
                    : '') +
                '\n문자는 작성 화면에서 직접 확인하고 발송해야 합니다.';

            if (!confirm(message)) return;

            location.href = `sms:${numbers.join(',')}`;
        });

        document.getElementById('editPhone').addEventListener('input', function () {
            let number = this.value.replace(/\D/g, '');

            if (number.startsWith('02')) {
                // 서울: 02-123-4567 / 02-1234-5678
                number = number.slice(0, 10);
                this.value = number.replace(
                    /^(02)(\d{0,4})(\d{0,4})$/,
                    function (_, prefix, middle, last) {
                        if (number.length > 9) {
                            return [prefix, middle, last].filter(Boolean).join('-');
                        }

                        return [
                            prefix,
                            number.slice(2, 5),
                            number.slice(5)
                        ].filter(Boolean).join('-');
                    }
                );
            } else {
                // 휴대폰·지역번호: 010-1234-5678 / 031-123-4567
                number = number.slice(0, 11);

                const middleEnd = number.length === 11 ? 7 : 6;

                this.value = [
                    number.slice(0, 3),
                    number.slice(3, middleEnd),
                    number.slice(middleEnd)
                ].filter(Boolean).join('-');
            }
        });
    </script>
